<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Explore your Claude Code configuration as an interactive graph." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>claude-mri</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash. 'system' follows the OS.
      try {
        var t = localStorage.getItem('claude-mri.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
